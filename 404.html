        .not-found-card {

            display: inline-flex;

            min-height: 40px;
            padding: 8px 14px;
            border-radius: 999px;

            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

            margin-bottom: 16px;
        }

        .not-found-card p {
            max-width: 52ch;
        }

        .not-found-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .primary-link,
        .secondary-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 14px 22px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .primary-link {
            background: linear-gradient(180deg, #d8b979 0%, #c59e53 100%);
            color: var(--black);
        }

        .secondary-link {
            border: 1px solid rgba(11, 9, 7, 0.12);
            color: var(--black);
            background: rgba(11, 9, 7, 0.03);
        }

        @media (max-width: 768px) {
            .not-found-card {
                padding: 28px;
                border-radius: 24px;
            }

            .not-found-actions {
                flex-direction: column;
            }

            .primary-link,
            .secondary-link {
